# Persistence — AOF + RDB defaults
appendonly yes
appendfsync everysec

# Networking
bind 0.0.0.0
# Safe: host port is bound to 127.0.0.1 in docker-compose.yaml (redis.conf has no inline comments)
protected-mode no
port 6379

# Memory: stay under the 1g container limit (REDIS_MEMORY) so Redis returns OOM
# errors instead of the kernel killing it; headroom is for AOF rewrite and buffers.
maxmemory 768mb
maxmemory-policy noeviction

# Logging
loglevel notice
